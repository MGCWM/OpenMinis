name: android-apk

# Builds the Android-only fork (official 1.13 + Ubuntu guest + persona) and
# uploads the signed-or-debug APK. Everything the app needs at runtime that is
# not committed (proot, the Ubuntu rootfs, the rclone gomobile binding) is
# produced here, in the same order the local build uses.
#
# Signing: set repo secrets MINIS_UPLOAD_STORE_BASE64, MINIS_UPLOAD_STORE_PASSWORD,
# MINIS_UPLOAD_KEY_ALIAS, MINIS_UPLOAD_KEY_PASSWORD to get a properly signed
# release. Without them the build still succeeds and ships a debug-signed APK.

on:
  workflow_dispatch:
  push:
    branches:
      - ubuntu-base
    tags:
      - 'v*'

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
      NDK_VERSION: 28.0.13004108
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle-home
      # Runners live outside the GFW: use the official repositories rather than
      # the Chinese mirrors a local build needs. Some mirrors also answer 404
      # for plugin markers that only exist on Maven Central. Quoted on purpose:
      # bare `off` is a YAML 1.1 boolean and does not survive as a string.
      MINIS_BUILD_MIRRORS: "off"

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # GitHub's runner image has the SDK but does not put sdkmanager on PATH,
      # so locate it instead of assuming.
      - name: Android SDK components
        run: |
          SDKMGR="$(command -v sdkmanager || true)"
          if [ -z "$SDKMGR" ]; then
            SDKMGR="$(find "${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}" -name sdkmanager -type f 2>/dev/null | head -n 1)"
          fi
          if [ -z "$SDKMGR" ]; then
            echo "sdkmanager not found — cannot install the SDK components" >&2
            exit 1
          fi
          yes | "$SDKMGR" --install \
            "platforms;android-36" \
            "build-tools;34.0.0" \
            "cmake;3.22.1" \
            "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      # proot's loader-info.awk uses strtonum(), a gawk extension. Ubuntu ships
      # mawk as /usr/bin/awk, so the build fails with "function strtonum never
      # defined" until gawk is installed and selected.
      - name: awk with strtonum
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gawk
          sudo update-alternatives --set awk /usr/bin/gawk

      - name: PRoot + talloc (aarch64)
        run: ./deps/build_proot.sh

      - name: Ubuntu rootfs + baked CA trust store
        run: ./scripts/prepare_android_sandbox.sh

      - name: Go toolchain
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: rclone gomobile binding
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          "$(go env GOPATH)/bin/gomobile" init
          ./deps/build_rclone_android.sh
          mkdir -p src/android/app/libs
          cp deps/build/rclone/rclone.aar src/android/app/libs/rclone.aar

      # NOTE: `secrets` cannot appear in a step-level `if:` — GitHub rejects the
      # whole workflow file ("Unrecognized named-value: 'secrets'"). Ask inside
      # the script instead, and pass the secret through env so it stays masked.
      - name: Signing key (optional)
        id: signing
        env:
          STORE_B64: ${{ secrets.MINIS_UPLOAD_STORE_BASE64 }}
        run: |
          if [ -z "$STORE_B64" ]; then
            echo "No signing key configured — assembleRelease will use the debug keystore."
            exit 0
          fi
          echo "$STORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "store=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"

      # The Gradle plugin markers (KSP) live on Maven Central / the plugin
      # portal, not on Google's maven. Record what this runner can actually
      # reach so a resolution failure is diagnosable from the log alone.
      - name: Probe plugin repositories
        run: |
          MARKER=com/google/devtools/ksp/com.google.devtools.ksp.gradle.plugin/2.1.0-1.0.29/com.google.devtools.ksp.gradle.plugin-2.1.0-1.0.29.pom
          for base in \
            https://repo.maven.apache.org/maven2 \
            https://plugins.gradle.org/m2 \
            https://dl.google.com/dl/android/maven2 \
            https://maven.aliyun.com/repository/gradle-plugin \
            https://mirrors.cloud.tencent.com/nexus/repository/maven-public ; do
            printf '%-58s ' "$(echo "$base" | cut -d/ -f3)"
            curl -s -o /dev/null -w '%{http_code}\n' --max-time 20 "$base/$MARKER" || echo unreachable
          done

      - name: Unit tests (endpoint-declared effort tiers)
        working-directory: src/android
        run: ./gradlew testDebugUnitTest --no-daemon --tests 'com.openminis.app.provider.EndpointDeclaredEffortTiersTest'

      - name: assembleRelease
        working-directory: src/android
        env:
          MINIS_UPLOAD_STORE_FILE: ${{ steps.signing.outputs.store }}
          MINIS_UPLOAD_STORE_PASSWORD: ${{ secrets.MINIS_UPLOAD_STORE_PASSWORD }}
          MINIS_UPLOAD_KEY_ALIAS: ${{ secrets.MINIS_UPLOAD_KEY_ALIAS }}
          MINIS_UPLOAD_KEY_PASSWORD: ${{ secrets.MINIS_UPLOAD_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      # Prove which key actually signed the artifact — the fingerprint must be
      # the upload key's, not the debug one, or in-place updates break.
      - name: Verify the APK signature
        working-directory: src/android
        run: |
          APK="$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)"
          echo "artifact: $APK"
          "$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner" verify --print-certs "$APK"

      - uses: actions/upload-artifact@v4
        with:
          name: minis-ubuntu-apk
          path: src/android/app/build/outputs/apk/release/*.apk
